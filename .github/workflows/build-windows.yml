name: Construire l'application Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - electron-main.js
      - .github/workflows/build-windows.yml
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm install
      - name: Générer les exécutables
        run: npm run build:windows
      - name: Publier les fichiers Windows
        uses: actions/upload-artifact@v4
        with:
          name: FNE-Sage-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

